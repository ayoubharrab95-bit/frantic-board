name: MoneyHunter hourly radar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query live paid-opportunity radar
        run: |
          set -euo pipefail
          BASE="https://moneyhunter-preflight.onrender.com"
          curl --fail --silent --show-error --location "$BASE/v1/radar?min_reward=5&limit=50&sources=frantic,github,algora,opire,clawlancer,mya,basedagents,taskbounty" -o radar.json
          curl --fail --silent --show-error --location "$BASE/v1/market-radar" -o market.json
          curl --fail --silent --show-error --location -H 'content-type: application/json' -d '{"capitalUsd":5}' "$BASE/v1/capital-plan" -o capital.json
          curl --fail --silent --show-error --location -H 'content-type: application/json' -d '{"capitalUsd":5}' "$BASE/v1/expansion-plan" -o expansion.json
          python - <<'PY'
          import json
          for name in ["radar.json","market.json","capital.json","expansion.json"]:
              print("\n###", name)
              data=json.load(open(name))
              print(json.dumps(data, ensure_ascii=False, indent=2)[:50000])
          PY
      - name: Keep intelligence snapshots
        uses: actions/upload-artifact@v4
        with:
          name: moneyhunter-intelligence-${{ github.run_id }}
          path: |
            radar.json
            market.json
            capital.json
            expansion.json
          retention-days: 14
