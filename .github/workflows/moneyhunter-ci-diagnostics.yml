name: MoneyHunter CI diagnostics
on:
  push:
    paths:
      - 'moneyhunter-preflight/**'
      - '.github/workflows/moneyhunter-ci-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneyhunter-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and test
        shell: bash
        run: |
          set +e
          npm install > /tmp/install.log 2>&1
          INSTALL=$?
          npm run check > /tmp/check.log 2>&1
          CHECK=$?
          npm test > /tmp/test.log 2>&1
          TEST=$?
          {
            echo "INSTALL=$INSTALL"
            echo "CHECK=$CHECK"
            echo "TEST=$TEST"
            echo "=== install ==="
            cat /tmp/install.log
            echo "=== check ==="
            cat /tmp/check.log
            echo "=== test ==="
            cat /tmp/test.log
          } > /tmp/moneyhunter-ci-report.txt
          cp /tmp/moneyhunter-ci-report.txt "$GITHUB_WORKSPACE/moneyhunter-ci-report.txt"
          exit $((INSTALL || CHECK || TEST))
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyhunter-ci-report
          path: moneyhunter-ci-report.txt
