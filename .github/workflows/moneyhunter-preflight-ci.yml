name: MoneyHunter Preflight CI

on:
  push:
    paths:
      - 'moneyhunter-preflight/**'
      - '.github/workflows/moneyhunter-preflight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneyhunter-preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
